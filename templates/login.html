<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Class Scheduler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; text-align: center; }
    label { font-size: 12px; color: #aaa; margin-bottom: 4px; display: block; }
    input { width: 100%; background: #16213e; border: 1px solid #0f3460; color: #eee; padding: 10px 12px; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #1a5a8a; }
    button { padding: 10px; background: #1a4731; border: 1px solid #2d6a4f; color: #4caf82; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; }
    button:hover { background: #2d6a4f; }
    .error { color: #f87171; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Class Scheduler</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
